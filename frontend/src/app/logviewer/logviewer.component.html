<div *ngIf="isLoading">Lade Meldungen...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<div  *ngIf="!isLoading && logs.length > 0" >
  <table class="registration-table">
    <thead>
    <tr>
      <th>Id</th>
      <th>Client IP</th>
      <th>Client Name</th>
      <th>Version</th>
      <th>Empfangen am</th>
      <th>Nachricht</th>
      <th>Fehlermeldung</th>
    </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logs">
        <td>{{ log.Id }}</td>
        <td>{{ log.ClientIp }}</td>
        <td>{{ log.ClientName }}</td>
        <td>{{ log.ClientVersion }}</td>
        <td>{{ log.CreatedDate }}</td>
        <td>{{ log.Message }}</td>
        <td>{{ log.Exception }}</td>
      </tr>
    </tbody>
  </table>
</div>

<button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1">Zurück</button>
<span>Seite {{ currentPage }}</span>
<button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage * pageSize >= totalItems">Weiter</button>

<div *ngIf="!isLoading && logs.length === 0">
  Keine Meldungen gefunden.
</div>
