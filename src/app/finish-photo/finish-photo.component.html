<p>Zieleinlauf</p>
<div class="scrollbox">
  <div *ngFor="let item of data">
    <img ngSrc='{{ "https://buero.luebeckregatta.de/images/" + item.firstPath }}' alt='{{ "picture " + item.firstPath }}' width="600" height="300">
    <img ngSrc='{{ "https://buero.luebeckregatta.de/images/" + item.secondPath }}' alt='{{ "picture " + item.secondPath }}' width="600" height="300">
    <p>{{ item.name }}</p>
  </div>
</div>
